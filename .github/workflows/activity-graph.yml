name: Update Activity Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: write

concurrency:
  group: update-activity-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate activity graph SVG
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Elaine-one
          options: theme=tokyo-night&bg_color=0D1117&hide_border=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish graph to a dedicated branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
